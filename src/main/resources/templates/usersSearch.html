<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <link th:href="@{/styles/main.css}" rel="stylesheet">
</head>
<body>
<div class="page">
    <nav>
        <a th:href="@{'/'}">
            <img src="/images/cart.png" alt="Logo">
        </a>
        <div class="nav-buttons" th:if="${session.user != null}">
            <a th:href="@{'/users/search'}">Search users</a>
            <a th:href="@{'/products'}">Products</a>
            <a th:unless="${session.user.hasAdminRole()}" th:href="@{'/orders'}">Orders</a>
            <a th:unless="${session.user.hasAdminRole()}" th:href="@{'/cart'}">Cart</a>
            <a th:if="${session.user.hasAdminRole()}" th:href="@{'/admin'}">Panel</a>
            <a th:href="@{'/auth/logout'}">Logout</a>
        </div>
        <div class="nav-buttons" th:if="${session.user == null}">
            <a th:href="@{'/auth/login'}">Login</a>
            <a th:href="@{'/auth/signup'}">Signup</a>
        </div>
    </nav>
    <div class="search-wrapper">
        <h1>Search users</h1>
        <form action="#" th:action="@{/users/search}" method="get">
            <input type="text" name="pattern" placeholder="Search..." aria-label="Search"/>
            <button type="submit" class="btn">Search</button>
        </form>
        <ul>
            <li th:each="user : ${users}">
                <a th:href="@{'/users/' + ${user.id}}" th:text="${user.firstName} + ' ' + ${user.lastName}"></a>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
