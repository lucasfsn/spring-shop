<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <link th:href="@{/styles/main.css}" rel="stylesheet">
</head>
<body>
<div class="page">
    <nav>
        <a th:href="@{'/'}">
            <img src="/images/cart.png" alt="Logo">
        </a>
        <div class="nav-buttons" th:if="${session.user != null}">
            <a th:href="@{'/users/search'}">Search users</a>
            <a th:href="@{'/products'}">Products</a>
            <a th:unless="${session.user.hasAdminRole()}" th:href="@{'/orders'}">Orders</a>
            <a th:unless="${session.user.hasAdminRole()}" th:href="@{'/cart'}">Cart</a>
            <a th:if="${session.user.hasAdminRole()}" th:href="@{'/admin'}">Panel</a>
            <a th:href="@{'/auth/logout'}">Logout</a>
        </div>
        <div class="nav-buttons" th:if="${session.user == null}">
            <a th:href="@{'/auth/login'}">Login</a>
            <a th:href="@{'/auth/signup'}">Signup</a>
        </div>
    </nav>
    <div class="admin-wrapper">
        <h1>Welcome, <span th:if="${session.user != null}" th:text="${session.user.getUsername()}"></span></h1>
        <div class="admin-form">
            <h2 class="text-center">Change User Role</h2>
            <form th:action="@{/admin/change-role}" th:object="${userRoleChangeForm}" method="post">
                <div class="form-row">
                    <label for="userId">User ID</label>
                    <input type="text" id="userId" name="userId" required/>
                    <div th:if="${roleError}" class="error-service">
                        <p th:text="${roleError}"></p>
                    </div>
                </div>
                <div class="form-row">
                    <label for="role">Role</label>
                    <select id="role" th:field="*{role}">
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="error"></div>
                </div>
                <button class="btn" type="submit">Change Role</button>
            </form>
        </div>
        <div class="admin-form">
            <h2 class="text-center">Create Category</h2>
            <form th:action="@{/admin/add-category}" th:object="${categoryAddForm}" method="post">
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" th:field="*{name}">
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
                    <div th:if="${categoryError}" class="error-service">
                        <p th:text="${categoryError}"></p>
                    </div>
                </div>
                <button class="btn" type="submit">Create Category</button>
            </form>
        </div>
        <div class="admin-form">
            <h2 class="text-center">Change Order Status</h2>
            <form th:action="@{/admin/order-status}" th:object="${orderStatusForm}" method="post">
                <div class="form-row">
                    <label for="orderId">Order ID</label>
                    <input type="text" id="orderId" name="orderId" required/>
                    <div th:if="${orderStatusError}" class="error-service">
                        <p th:text="${orderStatusError}"></p>
                    </div>
                </div>
                <div class="form-row">
                    <label for="status">Status</label>
                    <select id="status" th:field="*{status}">
                        <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="error"></div>
                </div>
                <button class="btn" type="submit">Change Status</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
