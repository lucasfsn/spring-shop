<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <link th:href="@{/styles/main.css}" rel="stylesheet">
</head>
<body>
<div class="page">
    <nav>
        <a th:href="@{'/'}">
            <img src="/images/cart.png" alt="Logo">
        </a>
        <div class="nav-buttons" th:if="${session.user != null}">
            <a th:href="@{'/products'}">Products</a>
            <a th:unless="${session.user.hasAdminRole()}" th:href="@{'/orders'}">Orders</a>
            <a th:unless="${session.user.hasAdminRole()}" th:href="@{'/cart'}">Cart</a>
            <a th:if="${session.user.hasAdminRole()}" th:href="@{'/admin'}">Panel</a>
            <a th:href="@{'/auth/logout'}">Logout</a>
        </div>
        <div class="nav-buttons" th:if="${session.user == null}">
            <a th:href="@{'/auth/login'}">Login</a>
            <a th:href="@{'/auth/signup'}">Signup</a>
        </div>
    </nav>
    <form action="/auth/login" th:object="${loginForm}" method="post">
        <h1 class="title">Login</h1>
        <div class="form-row">
            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}"/>
            <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></div>
        </div>
        <div class="form-row">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}"/>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
        </div>
        <div th:if="${error}" class="error-service">
            <p th:text="${error}"></p>
        </div>
        <button class="btn" type="submit">Login</button>
    </form>
</div>
</body>
</html>
